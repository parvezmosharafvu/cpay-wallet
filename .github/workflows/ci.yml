name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (wallet, vault, app data, auth and build tools)
        run: npm test
      - name: Web build (no database migration)
        run: npm run build:web
      - name: Mobile web bundle
        run: npm run build:mobile
      - name: Install isolated browser
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Wallet browser regressions (synthetic wallets, no funds)
        if: runner.os == 'Linux'
        run: npm run test:browser
